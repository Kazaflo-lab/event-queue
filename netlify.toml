[build]
  command = "npm run build"
  publish = "dist"

# Moving these flags into the environment block ensures Netlify 
# applies them correctly to the build process to bypass the scanner.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[build.processing]
  skip_processing = true
